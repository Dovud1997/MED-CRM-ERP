limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
server { listen 80; server_tokens off; client_max_body_size 220m;
  location /api/session/ { limit_req zone=api burst=20 nodelay; proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  location /api/clinic/ { limit_req zone=api burst=30 nodelay; proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  location /api/display/ { proxy_buffering off; proxy_cache off; proxy_read_timeout 1h; proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  location /api/ { limit_req zone=api burst=40 nodelay; proxy_pass http://api:4000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  location = / { add_header Cache-Control "no-store, no-cache, must-revalidate" always; proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { proxy_pass http://web:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
