services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: "${POSTGRES_DB}", POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}" }
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 10s, timeout: 5s, retries: 10 }
    networks: [private]
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck: { test: [CMD, redis-cli, ping], interval: 10s, timeout: 3s, retries: 10 }
    networks: [private]
  migrate:
    image: migrate/migrate:v4.18.3
    volumes: ["./apps/api/migrations:/migrations:ro"]
    command: ["-path", "/migrations", "-database", "${DATABASE_URL}", "up"]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [private]
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}" }
    volumes: [minio_data:/data]
    networks: [private]
  queue-media-init:
    image: alpine:3.22
    command: ["sh", "-c", "mkdir -p /data/queue-media && chown -R 65532:65532 /data/queue-media && chmod 700 /data/queue-media"]
    volumes: [queue_media:/data/queue-media]
    restart: "no"
    networks: [private]
  api:
    build: { context: ./apps/api }
    environment: { NODE_ENV: production, DATABASE_URL: "${DATABASE_URL}", REDIS_URL: "${REDIS_URL}", JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET}", JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET}", ACCESS_TOKEN_TTL: "${ACCESS_TOKEN_TTL}", REFRESH_TOKEN_TTL_DAYS: "${REFRESH_TOKEN_TTL_DAYS}", CORS_ORIGINS: "${CORS_ORIGINS}", QUEUE_MEDIA_PATH: "/data/queue-media", QUEUE_DISPLAY_URL: "${QUEUE_DISPLAY_URL:-http://localhost/display}" }
    volumes: [queue_media:/data/queue-media]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, migrate: { condition: service_completed_successfully }, queue-media-init: { condition: service_completed_successfully } }
    networks: [private]
  seed:
    image: med-api
    entrypoint: ["/seed"]
    environment: { NODE_ENV: development, DATABASE_URL: "${DATABASE_URL}", SEED_OWNER_LOGIN: "${SEED_OWNER_LOGIN}", SEED_OWNER_PASSWORD: "${SEED_OWNER_PASSWORD}" }
    depends_on: { migrate: { condition: service_completed_successfully } }
    profiles: [tools]
    networks: [private]
  web:
    build: { context: ., args: { APP: web } }
    environment: { NODE_ENV: production, NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL}", INTERNAL_API_URL: "http://api:4000/api/v1", DEFAULT_ORGANIZATION_ID: "${DEFAULT_ORGANIZATION_ID}", COOKIE_SECURE: "${COOKIE_SECURE}" }
    networks: [private]
  nginx:
    image: nginx:1.29-alpine
    ports: ["80:80"]
    volumes: ["./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web, api]
    networks: [private]
networks: { private: {} }
volumes: { postgres_data: {}, redis_data: {}, minio_data: {}, queue_media: {} }
